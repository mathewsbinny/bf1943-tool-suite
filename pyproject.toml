# The suite's packaging and tool settings.
#
# No install is needed to run the tools: `python -B <tool>.py` from a clone works, each script finding the suite's
# folders through its bootstrap (core/suitepath.py; README "Running the tools"). An install is for development:
#
#   pip install -e .              core (bfbc2core, suitepath) and the shared tool folders on sys.path (an editable
#                                 install's .pth file), so the bootstrap adds nothing for them; the NavKit variants
#                                 are still chosen by each script
#   pip install --group ci        the libraries, as CI installs them (pinned: the versions this PC runs), and the
#                                 check tools (ruff, pyright, pytest, coverage)
#
# A wheel (`pip install .`) holds the package bfbc2core only (suitepath finds the suite's folders from where it lies,
# so it is used from a clone). The tools stay in the clone.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bf1943-tool-suite"
version = "0.1.0"
description = "Tools for converting, inspecting and building AI data for Battlefield 1943 (XBLA), for the user's own copy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"          # the version the suite is tested on (CI too); hashlib.file_digest needs 3.11 at least
classifiers = ["Operating System :: Microsoft :: Windows", "Private :: Do Not Upload"]
# every tool: numpy; NavKit's builder (navedits) and its views: matplotlib
dependencies = ["numpy", "matplotlib"]

[project.optional-dependencies]
viewer = ["moderngl", "glfw", "imgui-bundle"]       # the 3D tools (Map Inspector, Navigation Studio: core viewer.py)
xex = ["capstone"]                                  # the executable tools' disassembler, the Xenia kit's assembler test
images = ["pillow"]                                 # rsnvtool's pictures
all = ["bf1943-tool-suite[viewer,xex,images]"]

[project.urls]
Repository = "https://github.com/mathewsbinny/bf1943-tool-suite"

[dependency-groups]
# what CI installs (`pip install --group ci`): every library the tests import, at the versions this PC runs, and
# the check tools
ci = [
    "numpy==2.5.4",
    "matplotlib==3.11.2",
    "moderngl==5.13.0",
    "glfw==2.11.0",
    "imgui-bundle==1.93.0",
    "capstone==5.0.9",
    "pillow==13.0.0",
    # the checks: the lint, the type check, tests through pytest, and coverage (CI's jobs; run_tests.py needs none
    # of them). pyright's [nodejs] extra brings Node.js as a PyPI wheel (nodejs-wheel-binaries), so the type check
    # downloads nothing but PyPI packages; the pyright wheel holds its own JavaScript
    "ruff==0.17.3",
    "pyright[nodejs]==1.1.414",
    "pytest==9.2.0",
    "coverage==7.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core/bfbc2core"]
# an editable install puts these folders on sys.path (suitepath.SHARED; tests/test_repo.py keeps the two lists equal)
dev-mode-dirs = [
    "core",
    "bf1943-fbrb-tool",
    "bf1943-apt-tools",
    "bf1943-spawn-map",
    "bf1943-console-readers/stfs",
    "bf1943-xenia-kit",
    "bf1943-automated-map-and-bot-test-harness/xenia-run",
    "bf1943-xex-tools",
    "bf1943-auto-navkit-common/tools",
]

[tool.hatch.build.targets.sdist]
only-include = ["core", "pyproject.toml", "README.md", "LICENSE"]

# Lint: `ruff check` (the version is pinned in the "ci" group). A small set of rules that find bugs, no style rules.
[tool.ruff]
line-length = 120                   # the code's own width (only the formatter and E501 use it; neither is run)
extend-include = ["*.pyw"]
cache-dir = "work/ruff-cache"       # in the generated work folder, not beside the code
extend-exclude = [
    "work",                         # the suite's work folder (generated)
    "output",                       # bf1943-xenia-kit/output (the extracted game)
    # the VMX validation's inputs (bf1943-xex-tools/vmx_inputs.py INPUTS): their bytes are fingerprinted, so they
    # are never edited, not even for a lint fix; tests/test_repo.py keeps this list equal to INPUTS' .py files
    "bf1943-xex-tools/build_vmx_language.py",
    "bf1943-xex-tools/xenon_vector_semantics.py",
    "bf1943-xex-tools/xenon_splice.py",
]

[tool.ruff.lint]
# F pyflakes (undefined and unused names, ...), E9 syntax and IO errors, E402 imports below code, B bugbear,
# PLE pylint's errors
select = ["F", "E9", "E402", "B", "PLE"]
ignore = [
    # zip() without strict=: adding strict=True would raise where the code relies on zip stopping at the shortest
    "B905",
    # a closure using a loop variable: all 77 sites (2026-10-31) call the closure within the same iteration
    # (sort keys, local helpers), where late binding cannot bite; a closure kept past its iteration binds the value
    # as a default argument (navbuild/merge.py does)
    "B023",
]
# E402: a script's imports from other suite folders follow the bootstrap (core/suitepath.py) and
# `sys.dont_write_bytecode = True` by design; each such import carries `# noqa: E402`

# Types: `python -m pyright` (pinned in the "ci" group; README "Types"; set PYRIGHT_PYTHON_IGNORE_WARNINGS=1 so it does
# not ask PyPI for a newer version). The folders whose code is annotated, checked at pyright's "standard" strictness;
# a folder is added to `include` once it is annotated and passes.
[tool.pyright]
# every library and tool module (2026-11-01). bf1943-xex-tools is listed by file: its folder holds the VMX
# validation's inputs, which are never edited and so never checked. Tests are left out (**/tests below)
include = [
    "core/bfbc2core",
    "bf1943-auto-navkit-common/tools",
    "bf1943-auto-navkit-big-endian/tools",
    "bf1943-auto-navkit-little-endian",
    "bf1943-xenia-kit",
    "bf1943-automated-map-and-bot-test-harness/xenia-run",
    "bf1943-fbrb-tool",
    "bf1943-console-readers/stfs",
    "bf1943-apt-tools",
    "bf1943-spawn-map",
    "bf1943-map-inspector",
    "bf1943-navigation-studio",
    "bf1943-xex-tools/bfbc2dis.py",
    "bf1943-xex-tools/classify_vmx.py",
    "bf1943-xex-tools/export_callgraph_strings.py",
    "bf1943-xex-tools/inspect_decoded.py",
    "bf1943-xex-tools/inventory_vmx.py",
    "bf1943-xex-tools/map_functions.py",
    "bf1943-xex-tools/map_imports.py",
    "bf1943-xex-tools/parse_function_trace.py",
    "bf1943-xex-tools/ppcdis.py",
    "bf1943-xex-tools/record_batch_decompile.py",
    "bf1943-xex-tools/record_vmx_validation.py",
    "bf1943-xex-tools/resolve_helpers.py",
    "bf1943-xex-tools/verify_xex_image.py",
    "bf1943-xex-tools/vmx_inputs.py",
    "bf1943-xex-tools/workspace.py",
    "bf1943-xex-tools/xenonrecomp_reference.py",
    "bf1943-xex-tools/xexrefs.py",
    "tools/import_opfor.py",
    "run_tests.py",
    "tests/functions.py",
    "conftest.py",
    "BF1943 Tool Suite.pyw",
]
# the VMX validation's inputs are never edited (as in [tool.ruff]), so never checked: none may be in an included
# folder (tests/test_repo.py checks it)
exclude = ["**/work", "**/output", "**/__pycache__", "bf1943-*/**/tests", "core/tests"]
# where the included code's imports are found: the folders suitepath.use puts on sys.path (SHARED and both NavKit
# variants; no module name is in two of them, so the order changes nothing)
extraPaths = [
    "core",
    "bf1943-fbrb-tool",
    "bf1943-apt-tools",
    "bf1943-spawn-map",
    "bf1943-console-readers/stfs",
    "bf1943-xenia-kit",
    "bf1943-automated-map-and-bot-test-harness/xenia-run",
    "bf1943-xex-tools",
    "bf1943-auto-navkit-common/tools",
    "bf1943-auto-navkit-big-endian/tools",
    "bf1943-auto-navkit-big-endian",
    "bf1943-auto-navkit-little-endian/tools",
    "bf1943-auto-navkit-little-endian",
]
pythonVersion = "3.13"
pythonPlatform = "Windows"
typeCheckingMode = "standard"

# Tests under pytest (`python -B -m pytest`, README "Tests"); run_tests.py needs none of this.
[tool.pytest.ini_options]
minversion = "9.0"
pythonpath = ["core"]               # for conftest.py, which puts the other suite folders on sys.path (suitepath.use)
# the test files' folders are not packages and several share names (tests/): import each by its path, put none on
# sys.path; and no .pytest_cache in the suite
addopts = ["--import-mode=importlib", "-p", "no:cacheprovider"]
python_files = ["test_*.py"]
norecursedirs = [".*", "work", "output", "docs", "provenance", "__pycache__", "research"]

# Line coverage of a tier, its child processes included (README "Coverage"; CI's coverage job). Set, all absolute
# (tests start children in other folders, and coverage reads relative paths from each process's own folder):
#   COVERAGE_PROCESS_START=<suite>\pyproject.toml   every Python started with it set measures itself (coverage
#                                                   installs a .pth file that starts it): the runner, its tests and
#                                                   their children
#   COVERAGE_FILE=<suite>\.coverage                 where each process writes its data (.coverage.<host>.<pid>...)
#   COVERAGE_SOURCE=<suite>                         what is measured: the suite's files, the never-run ones too
# then `python -B run_tests.py quick` (or pytest), `python -m coverage combine`, `python -m coverage report`.
[tool.coverage.run]
parallel = true                     # one data file per process, joined by `coverage combine`
source = ["${COVERAGE_SOURCE-.}"]
omit = ["*/work/*", "*/output/*"]

[tool.coverage.report]
include_namespace_packages = true   # the suite's folders are not packages: their files that never ran count too
omit = ["*/tests/*", "*/conftest.py"]   # the tools and libraries, not the tests
skip_empty = true
precision = 1
# the quick tier's threshold: `coverage report` exits 2 below it, and CI's coverage job fails. A ratchet: it only
# goes up (tests/test_repo.py checks every commit of this file); README "Coverage" says how to raise it.
# 2026-10-31: quick tier 83.2 % (80.5 % without the parsers' fuzz tests)
fail_under = 80
