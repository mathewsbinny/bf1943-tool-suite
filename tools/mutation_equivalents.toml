# --- core/bfbc2core/terrain.py ---

[[equivalent]]
key = "terrain.py:read.fits:compare:2 <= n <= 32768 -> 2 <= n < 32768"
reason = "only n = 32768 differs, and fits() then also needs 2 x 32768^2 bytes of samples: no file under 2 GiB fits with it either way (the reader is never given one)"

[[equivalent]]
key = "terrain.py:read.fits:constant:32768 -> 32769"
reason = "the one size newly in range, 32769, is not a power of two, which fits() requires"

[[equivalent]]
key = "terrain.py:read.fits:constant:1 -> 2"
reason = "n & (n - 2) == 0 holds for the same n >= 2 as n & (n - 1) == 0: the powers of two (checked for every n below 2^16)"

[[equivalent]]
key = "terrain.py:read:constant:1 -> 2"
reason = "size & (size - 2) for size & (size - 1), with size >= 2 (checked just before): zero for the same sizes, the powers of two"

[[equivalent]]
key = "terrain.py:read:drop:fits('<') or not fits('>') -> not fits('>')"
reason = "fits('<') true means a little-endian size of at most 2^15; the same four bytes read big-endian are at least 2^16, so fits('>') is false and not fits('>') is already true"

