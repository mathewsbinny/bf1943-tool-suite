# Equivalent mutants of tools/mutate.py (README "Mutation testing"): changes no test could see, as the code behaves
# the same with them. Each is left out of its module's score. key: as `python -B tools\mutate.py --list` prints it;
# reason: why the behaviour cannot change. A key that matches no mutant any more is reported, to be removed.

# --- core/bfbc2core/dbx.py ---

[[equivalent]]
key = "dbx.py:_varint:constant:63 -> 64"
reason = "shift only takes multiples of 7 (0, 7, ..., 63, 70): shift > 63 and shift > 64 are true for the same values"

[[equivalent]]
key = "dbx.py:_strings:compare:end < 0 -> end <= 0"
reason = "a string found ends at or after its start, which is at least 24 (the header): end is -1 or at least 24"

[[equivalent]]
key = "dbx.py:_strings:constant:0 -> 1"
reason = "end < 1 for end < 0: end is -1 or at least 24, as above"

[[equivalent]]
key = "dbx.py:_net_g:constant:1 -> 2"
reason = "Decimal(2).scaleb(n) for Decimal(1).scaleb(n) as quantize's unit: quantize uses only the unit's exponent, the same"

[[equivalent]]
key = "dbx.py:_net_g:constant:1 -> 2 #3"
reason = "the same change in the carry's second quantize: only the unit's exponent is used"

[[equivalent]]
key = "dbx.py:_net_g:constant:1 -> 2 #4"
reason = "after a carry (9.99... rounded up) the value is exactly a power of ten; quantized one digit coarser it is the same power of ten, and the trailing zeros are stripped from the digits"

[[equivalent]]
key = "dbx.py:_net_g:compare:r < 0 -> r <= 0"
reason = "r is never 0: a zero value returns '0' before, and a nonzero value quantized at its own exponent stays nonzero"

[[equivalent]]
key = "dbx.py:_net_g:drop:str(abs(r.scaleb(-cast(int, r.as_tuple().exponent)))).rstrip('0') or '0' -> str(abs(r.scaleb(-cast(int, r.as_tuple().exponent)))).rstrip('0')"
reason = "the digits of a nonzero r have a nonzero first digit, so stripping zeros never leaves an empty string"

[[equivalent]]
key = "dbx.py:_net_r_double:compare:v > 0 -> v >= 0"
reason = "only reached for an infinite v: v > 0 and v >= 0 agree on both infinities"

[[equivalent]]
key = "dbx.py:_net_r_double:constant:0 -> 1 #2"
reason = "v > 1 for v > 0, only reached for an infinite v: both agree on both infinities"

