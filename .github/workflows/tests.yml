# The quick tier on every push and pull request, on Windows (the suite uses msvcrt locks, PowerShell and the
# .NET Framework C# compiler). CI has no game copy, no research workspace and no Xenia, and downloads none: only
# Python libraries from PyPI. The tools run from the checkout without an install, as end users run them; the
# package install is checked last, apart. Two jobs:
#   quick      the lint (ruff), the type check (pyright), then the quick tier through run_tests.py --strict, then the
#              package install
#   coverage   the quick tier again, through pytest (so pytest's way is run too), with line coverage of every
#              process it starts; the report is uploaded as the artifact "coverage", then the total must reach
#              pyproject.toml's [tool.coverage.report] fail_under (a threshold that only goes up: tests/test_repo.py)
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quick:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # tests/test_repo.py reads the whole history (no game files or large blobs, no co-author lines, one author);
          # a pull request is checked out at its own head, not at GitHub's merge commit
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'          # this PC's (3.13.15)

      - name: Install the libraries (pyproject.toml dependency group "ci")
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group ci
          python -m pip list

      - name: Lint (ruff, pinned in the "ci" group; settings in pyproject.toml [tool.ruff])
        run: python -m ruff check --no-cache .

      - name: Type check (pyright, pinned in the "ci" group; settings in pyproject.toml [tool.pyright])
        # Node.js from the nodejs-wheel PyPI package (pyright[nodejs]), not the image's, and no PyPI version lookup
        env:
          PYRIGHT_PYTHON_GLOBAL_NODE: '0'
          PYRIGHT_PYTHON_IGNORE_WARNINGS: '1'
        run: python -m pyright

      - name: No game copy, no research workspace
        # empty folders: a test that needs either skips with its reason, and --strict below fails on any skip
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\no-game", "$env:RUNNER_TEMP\no-research" | Out-Null
          "BF1943_GAME=$env:RUNNER_TEMP\no-game" >> $env:GITHUB_ENV
          "BF1943_RESEARCH=$env:RUNNER_TEMP\no-research" >> $env:GITHUB_ENV

      - name: Build the C# tools (build.bat, the .NET Framework 4 compiler that ships with Windows)
        run: |
          $csc = 'C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe'
          if (-not (Test-Path $csc)) { throw "C# compiler not found: $csc" }
          cmd /c bf1943-dbx-tools\build.bat
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmd /c bf1943-diff-workbench\level-diff\build.bat
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Quick tier (strict)
        run: python -B run_tests.py quick --strict

      - name: The package installs, and an install changes nothing for the tools
        # after the tests, so they ran without it; hatchling comes from PyPI
        run: |
          python -m pip install -e . --no-deps
          python -B -c "import bfbc2core, suitepath, fbrb1943, apt, spawnmap, stfs, bots, guestmem, workspace; print('imports ok')"
          python -B tests/test_cli_errors.py

  coverage:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0                  # as in quick: tests/test_repo.py reads the whole history
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'

      - name: Install the libraries (pyproject.toml dependency group "ci": pytest and coverage too)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group ci

      - name: No game copy, no research workspace
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\no-game", "$env:RUNNER_TEMP\no-research" | Out-Null
          "BF1943_GAME=$env:RUNNER_TEMP\no-game" >> $env:GITHUB_ENV
          "BF1943_RESEARCH=$env:RUNNER_TEMP\no-research" >> $env:GITHUB_ENV

      - name: Build the C# tools
        run: |
          cmd /c bf1943-dbx-tools\build.bat
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmd /c bf1943-diff-workbench\level-diff\build.bat
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Quick tier under pytest, with coverage of every Python process it starts
        # COVERAGE_PROCESS_START: each Python started with it measures itself (the .pth file coverage installs), the
        # tests' children too; all three absolute, as tests start children in other folders (pyproject.toml)
        run: |
          $env:COVERAGE_PROCESS_START = "$PWD\pyproject.toml"
          $env:COVERAGE_FILE = "$PWD\.coverage"
          $env:COVERAGE_SOURCE = "$PWD"
          python -B -m pytest --tier quick --strict-skips -q -rs

      - name: Coverage report
        if: always()
        # written whatever the total (--fail-under=0); the threshold is the last step's
        run: |
          $env:COVERAGE_FILE = "$PWD\.coverage"
          python -m coverage combine
          python -m coverage report --fail-under=0 | Tee-Object coverage.txt
          python -m coverage html -d coverage-html --fail-under=0
          python -m coverage xml -o coverage.xml --fail-under=0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: coverage
          path: |
            coverage.txt
            coverage.xml
            coverage-html/

      - name: Coverage threshold (pyproject.toml [tool.coverage.report] fail_under)
        # coverage exits 2 when the total is below fail_under (README "Coverage": how to raise it)
        run: |
          $env:COVERAGE_FILE = "$PWD\.coverage"
          python -m coverage report --format=total
          if ($LASTEXITCODE) { Write-Error "quick-tier line coverage is below pyproject.toml's fail_under"; exit $LASTEXITCODE }
